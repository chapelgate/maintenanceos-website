name: Scanner V2 Stage 7 focused Chromium diagnostic

on:
  push:
    branches:
      - fix/scanner-v2-stage7-discovery-integration-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage7-final
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused real Chromium acceptance
        env:
          SCANNER_V2_BROWSER_TEST: "1"
        run: node --experimental-strip-types --test packages/onboarding-ingest/src/scanner-v2-renderer.test.ts
