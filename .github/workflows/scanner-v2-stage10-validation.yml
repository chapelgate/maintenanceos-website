name: Scanner V2 Stage 10 validation

on:
  push:
    branches:
      - feat/scanner-v2-stage10-refresh-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage10-refresh
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage 10 targeted refresh tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/scanner-v2-refresh.test.ts             packages/onboarding-ingest/src/scanner-v2-worker.test.ts             packages/onboarding-ingest/src/fetch-safe.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Stage 10 invariants
        shell: bash
        run: |
          set -euo pipefail
          base="2d896872cf4368437f81d94dc6364c6aa4777674"
          git diff --exit-code "$base"...HEAD --             src/components             src/app             packages/sandbox-test-call             packages/receptionist-draft
          echo "CREATE_AND_PHONE_SURFACE_UNCHANGED=PASS"
          test -f packages/onboarding-ingest/src/scanner-v2-refresh.ts
          test -f packages/onboarding-ingest/src/scanner-v2-refresh.test.ts
          echo "STAGE10_REFRESH_CONTRACT_PRESENT=PASS"
