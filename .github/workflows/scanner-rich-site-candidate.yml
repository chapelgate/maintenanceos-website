name: Scanner rich-site candidate validation

on:
  push:
    branches:
      - fix/scanner-rich-public-sites-20261001

permissions:
  contents: write

concurrency:
  group: scanner-rich-site-candidate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit, type and claims-safe validation
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/onboarding-ingest/src/fetch-safe.test.ts \
            packages/onboarding-ingest/src/extract.test.ts \
            packages/onboarding-ingest/src/scan.test.ts \
            packages/onboarding-ingest/src/function-wrapper.test.ts
          npx tsc --noEmit
      - name: Real public-site acceptance through candidate source
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          import { runScan } from './packages/onboarding-ingest/src/scan.ts';

          const cases = [
            {
              url: 'https://alleygates.co.uk/',
              assert(result) {
                const blob = JSON.stringify(result);
                if (!result.ok) throw new Error('Alley Gates scan failed: ' + blob);
                if (!/Alley|CCTV|Security|Gate|key/i.test(result.draft.services ?? result.draft.faqs ?? '')) {
                  throw new Error('Alley Gates useful knowledge missing: ' + blob);
                }
              },
            },
            {
              url: 'https://expressgasdelivery.com/',
              assert(result) {
                const blob = JSON.stringify(result);
                if (!result.ok) throw new Error('Express Gas scan failed: ' + blob);
                if (!result.draft.hours) throw new Error('Express Gas hours missing: ' + blob);
                if (!/Propane|Patio|Beer Gas|Gas Cylinders/i.test(result.draft.services ?? '')) {
                  throw new Error('Express Gas services missing: ' + blob);
                }
              },
            },
          ];

          for (const item of cases) {
            const result = await runScan(item.url, { enabled: true });
            console.log(item.url, JSON.stringify(result, null, 2));
            item.assert(result);
          }
          NODE
      - name: Build exact DigitalOcean Functions artifact
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 \
            packages/onboarding-ingest/packages/website/scan/index.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node22 \
            --outfile=packages/onboarding-ingest/packages/website/scan/bundle.cjs
          node --experimental-strip-types --test packages/onboarding-ingest/src/function-wrapper.test.ts
      - name: Commit generated function bundle once
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/onboarding-ingest/packages/website/scan/bundle.cjs; then
            echo "bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/onboarding-ingest/packages/website/scan/bundle.cjs
          git commit -m "build: refresh scanner function bundle for rich public sites"
          git push
