name: Scanner rich-site candidate validation

on:
  push:
    branches:
      - fix/scanner-rich-public-sites-20261001

permissions:
  contents: read

concurrency:
  group: scanner-rich-site-candidate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Full repository regression
        run: |
          set -euo pipefail
          npm test
          npm run accessibility:check
          npx tsc --noEmit
          npx eslint \
            packages/onboarding-ingest/src/fetch-safe.ts \
            packages/onboarding-ingest/src/extract.ts \
            packages/onboarding-ingest/src/scan.ts \
            packages/onboarding-ingest/src/fetch-safe.test.ts \
            packages/onboarding-ingest/src/extract.test.ts \
            packages/onboarding-ingest/src/scan.test.ts
          npm run build

      - name: Browser and mobile regression
        run: |
          set -euo pipefail
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          export BROWSER_PATH
          npm run browser:smoke
          NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads \
          NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan \
            node scripts/create-mobile-stability-browser.mjs

      - name: Repeated real public-site acceptance
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          import { runScan } from './packages/onboarding-ingest/src/scan.ts';

          function assertAlley(result) {
            const blob = JSON.stringify(result);
            if (!result.ok) throw new Error('Alley Gates scan failed: ' + blob);
            const knowledge = [result.draft.services, result.draft.faqs].filter(Boolean).join('\n');
            if (!/Alley Gate Installation/i.test(knowledge)) {
              throw new Error('Alley Gate Installation missing: ' + blob);
            }
            if (!/CCTV/i.test(knowledge) || !/Security Fencing/i.test(knowledge)) {
              throw new Error('Alley Gates service knowledge incomplete: ' + blob);
            }
            if (!/Alley Gate Keys/i.test(knowledge)) {
              throw new Error('Alley Gate Keys missing: ' + blob);
            }
          }

          function assertExpress(result) {
            const blob = JSON.stringify(result);
            if (!result.ok) throw new Error('Express Gas scan failed: ' + blob);
            if (!/Mo-Fr 08:00-16:00/i.test(result.draft.hours ?? '')) {
              throw new Error('Express Gas opening hours missing: ' + blob);
            }
            if (!/Propane Gas Cylinders/i.test(result.draft.services ?? '')) {
              throw new Error('Express Gas propane service missing: ' + blob);
            }
            if (!/Patio Gas/i.test(result.draft.services ?? '')) {
              throw new Error('Express Gas patio service missing: ' + blob);
            }
          }

          for (let iteration = 1; iteration <= 3; iteration += 1) {
            console.log('ITERATION', iteration);
            const alley = await runScan('https://alleygates.co.uk/', { enabled: true });
            console.log('ALLEY', JSON.stringify(alley));
            assertAlley(alley);

            const express = await runScan('https://expressgasdelivery.com/', { enabled: true });
            console.log('EXPRESS', JSON.stringify(express));
            assertExpress(express);
          }
          NODE

      - name: Exact DigitalOcean Function artifact check
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.10 \
            packages/onboarding-ingest/packages/website/scan/index.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node22 \
            --outfile=/tmp/scan-bundle.cjs
          cmp /tmp/scan-bundle.cjs packages/onboarding-ingest/packages/website/scan/bundle.cjs
          node --experimental-strip-types --test packages/onboarding-ingest/src/function-wrapper.test.ts
          git diff --exit-code
