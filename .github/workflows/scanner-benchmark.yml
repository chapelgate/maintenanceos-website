name: Scanner Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Run scanner benchmark CI
        run: npm run benchmark:scanner -- --ci