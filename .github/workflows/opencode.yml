name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One agent run per comment; the estate factory loop limits total concurrency (2 by day, 3 overnight, all repos).
concurrency:
  group: opencode-nvidia-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only Andy's account can trigger it, and only with an explicit /oc or /opencode command.
    if: |
      github.event.comment.user.login == 'chapelgate' &&
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode'))
    # GitHub-hosted only (AGENTS.md owner exception). Never self-hosted or estate runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # checkout only; commits go through the OpenCode GitHub App token
      id-token: write       # OIDC exchange for the OpenCode App installation token
      pull-requests: write  # post-step appends estate lines; the app token is already revoked
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The OpenCode action checks out the head it creates, so copy the writer first.
      - name: Stage estate-line writer
        run: cp scripts/opencode-estate-body.py "$RUNNER_TEMP/opencode-estate-body.py"

      - name: Use Node 22 (so the agent can run typecheck, lint and tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Estate Nvidia gate (Andy standing order 11 Oct 2026 09:07): no fixed model.
      # Same ladder as the box router's gate.json, without openai/gpt-oss-20b (it cannot use tools).
      # Every run probes from the top rung down with one 1-token request and uses the first model
      # that answers 200, so a blocked model is stepped past and a recovered one is picked up again.
      - name: Pick model from estate Nvidia ladder
        id: pick
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          for m in nvidia/nemotron-3-super-120b-a12b z-ai/glm-5.3-flash nvidia/nemotron-3.5-lightning-30b-a3b nvidia/nemotron-nano-3-30b-a3b; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}],\"max_tokens\":1}")
            echo "ladder: $m -> $code"
            if [ "$code" = "200" ]; then echo "model=nvidia/$m" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No Nvidia model on the ladder is available; job stops (work waits, never paid)."
          exit 1

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: ${{ steps.pick.outputs.model }}
          share: false

      # OpenCode writes the pull request body without the estate lines. Append a
      # route the pinned gate accepts. The worker name is Estate-Worker, which
      # that gate does not read. TRIVIAL is the default because it is the class
      # that needs no spec files (docs/evidence fast path).
      - name: Append estate gate lines
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NUMBER: ${{ github.event_name == 'pull_request_review_comment' && github.event.pull_request.number || github.event.issue.number }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_IS_PR: ${{ github.event_name == 'pull_request_review_comment' && 'true' || (github.event.issue.pull_request != null && 'true' || 'false') }}
        run: |
          set -euo pipefail
          numbers="$(python3 "$RUNNER_TEMP/opencode-estate-body.py" --select)"
          if [ -z "$numbers" ]; then
            echo "No pull request opened or updated by this run."
            exit 0
          fi
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            body_file="$RUNNER_TEMP/opencode-pr-${number}.md"
            current="$(gh pr view "$number" --repo "$REPO" --json body --jq .body)"
            write_status=0
            python3 "$RUNNER_TEMP/opencode-estate-body.py" --write "$body_file" <<<"$current" || write_status=$?
            if [ "$write_status" -eq 3 ]; then
              echo "PR #${number} already has Estate-Preflight, Estate-Route, and Estate-Artifact."
              continue
            fi
            [ "$write_status" -eq 0 ]
            gh pr edit "$number" --repo "$REPO" --body-file "$body_file"
          done <<< "$numbers"

