name: Step 5 DigitalOcean App Platform deploy

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact deployed main SHA authorised for onboarding-scan retirement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maintenanceos-website-provider-retirement
  cancel-in-progress: false

jobs:
  retire-onboarding-scan:
    runs-on: [self-hosted, Windows, X64, mos-retire]
    timeout-minutes: 15
    env:
      DO_APP_ID: 98e3a9c0-3b3c-48eb-ac72-2b13ffbe2661
      PUBLIC_BASE_URL: https://seahorse-app-4oasq.ondigitalocean.app
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact main and live release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteMain = ((git ls-remote origin refs/heads/main) -split "`t")[0]
          if ($remoteMain -ne $env:EXPECTED_SOURCE_SHA) { throw "main drift: $remoteMain != $env:EXPECTED_SOURCE_SHA" }
          $release = Invoke-RestMethod -Headers @{ 'Cache-Control'='no-cache' } -Uri ($env:PUBLIC_BASE_URL + '/release.json?provider_retire=' + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
          if ($release.commit -ne $env:EXPECTED_SOURCE_SHA) { throw "live release drift: $($release.commit) != $env:EXPECTED_SOURCE_SHA" }
          python scripts/remove-onboarding-scan-service.py --dependency-check-only
          if ($LASTEXITCODE -ne 0) { throw 'live bundle still references paid onboarding scan' }

      - name: Unit-test provider retirement guard
        shell: pwsh
        run: |
          python scripts/test_remove_onboarding_scan_service.py
          if ($LASTEXITCODE -ne 0) { throw 'provider retirement guard tests failed' }

      - name: Dry-run provider mutation and capture original spec
        shell: pwsh
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DIGITALOCEAN_TOKEN)) { throw 'DigitalOcean repository secret unavailable' }
          python scripts/remove-onboarding-scan-service.py
          if ($LASTEXITCODE -ne 0) { throw 'provider retirement dry-run refused' }
          $headers = @{ Authorization = 'Bearer ' + $env:DIGITALOCEAN_TOKEN }
          $app = Invoke-RestMethod -Headers $headers -Uri ('https://api.digitalocean.com/v2/apps/' + $env:DO_APP_ID)
          $spec = $app.app.spec
          $spec | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'mos-original-spec.json')
          $serviceNames = @($spec.services | ForEach-Object { $_.name })
          $staticNames = @($spec.static_sites | ForEach-Object { $_.name })
          $targetRules = @($spec.ingress.rules | Where-Object { $_.component.name -eq 'onboarding-scan' }).Count
          Write-Output ('PRE_STATIC_SITES=' + ($staticNames -join ','))
          Write-Output ('PRE_SERVICES=' + ($serviceNames -join ','))
          Write-Output ('PRE_TARGET_INGRESS_RULES=' + $targetRules)
          if (@($serviceNames | Where-Object { $_ -eq 'onboarding-scan' }).Count -ne 1) { throw 'expected exactly one onboarding-scan service before apply' }
          if ($staticNames.Count -lt 1) { throw 'no static site present before apply' }

      - name: Apply guarded onboarding-scan retirement
        shell: pwsh
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/remove-onboarding-scan-service.py --apply --confirm '98e3a9c0-3b3c-48eb-ac72-2b13ffbe2661:onboarding-scan'
          if ($LASTEXITCODE -ne 0) { throw 'guarded provider retirement failed' }

      - name: Verify unrelated App Platform spec preserved
        shell: pwsh
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = 'Bearer ' + $env:DIGITALOCEAN_TOKEN; 'Content-Type'='application/json' }
          $prePath = Join-Path $env:RUNNER_TEMP 'mos-original-spec.json'
          $pre = Get-Content -Raw $prePath | ConvertFrom-Json
          $postApp = Invoke-RestMethod -Headers $headers -Uri ('https://api.digitalocean.com/v2/apps/' + $env:DO_APP_ID)
          $post = $postApp.app.spec
          $failures = New-Object System.Collections.Generic.List[string]
          if (@($post.services | Where-Object { $_.name -eq 'onboarding-scan' }).Count -ne 0) { $failures.Add('target service still present') }
          if (@($post.ingress.rules | Where-Object { $_.component.name -eq 'onboarding-scan' }).Count -ne 0) { $failures.Add('target ingress still present') }
          $preStatic = @($pre.static_sites) | ConvertTo-Json -Depth 100 -Compress
          $postStatic = @($post.static_sites) | ConvertTo-Json -Depth 100 -Compress
          if ($preStatic -ne $postStatic) { $failures.Add('static_sites changed') }
          $preServices = @($pre.services | Where-Object { $_.name -ne 'onboarding-scan' }) | ConvertTo-Json -Depth 100 -Compress
          $postServices = @($post.services) | ConvertTo-Json -Depth 100 -Compress
          if ($preServices -ne $postServices) { $failures.Add('unrelated services changed') }
          $preRules = @($pre.ingress.rules | Where-Object { $_.component.name -ne 'onboarding-scan' }) | ConvertTo-Json -Depth 100 -Compress
          $postRules = @($post.ingress.rules) | ConvertTo-Json -Depth 100 -Compress
          if ($preRules -ne $postRules) { $failures.Add('unrelated ingress rules changed') }
          $preTop = [ordered]@{}; $postTop = [ordered]@{}
          foreach($prop in $pre.PSObject.Properties.Name){ if($prop -notin @('services','ingress')){ $preTop[$prop]=$pre.$prop } }
          foreach($prop in $post.PSObject.Properties.Name){ if($prop -notin @('services','ingress')){ $postTop[$prop]=$post.$prop } }
          if (($preTop | ConvertTo-Json -Depth 100 -Compress) -ne ($postTop | ConvertTo-Json -Depth 100 -Compress)) { $failures.Add('unrelated top-level spec changed') }
          if ($failures.Count -gt 0) {
            Write-Error ('POST_SPEC_VERIFY_FAILED=' + ($failures -join '; '))
            $restoreBody = @{ spec = $pre } | ConvertTo-Json -Depth 100
            Invoke-RestMethod -Method Put -Headers $headers -Uri ('https://api.digitalocean.com/v2/apps/' + $env:DO_APP_ID) -Body $restoreBody | Out-Null
            throw 'provider spec verification failed; original spec restored'
          }
          $postServiceNames = @($post.services | ForEach-Object { $_.name })
          $postStaticNames = @($post.static_sites | ForEach-Object { $_.name })
          Write-Output ('POST_STATIC_SITES=' + ($postStaticNames -join ','))
          Write-Output ('POST_SERVICES=' + ($postServiceNames -join ','))
          Write-Output 'UNRELATED_SPEC_PRESERVED=true'
          $root = (Invoke-WebRequest -UseBasicParsing -Uri ($env:PUBLIC_BASE_URL + '/')).StatusCode
          $create = (Invoke-WebRequest -UseBasicParsing -Uri ($env:PUBLIC_BASE_URL + '/create/')).StatusCode
          try { $scan = (Invoke-WebRequest -UseBasicParsing -Uri ($env:PUBLIC_BASE_URL + '/onboarding-scan/health')).StatusCode } catch { $scan = [int]$_.Exception.Response.StatusCode }
          Write-Output ('POST_HTTP_ROOT=' + $root)
          Write-Output ('POST_HTTP_CREATE=' + $create)
          Write-Output ('POST_HTTP_SCAN_HEALTH=' + $scan)
          if ($root -ne 200 -or $create -ne 200 -or $scan -eq 200) {
            $restoreBody = @{ spec = $pre } | ConvertTo-Json -Depth 100
            Invoke-RestMethod -Method Put -Headers $headers -Uri ('https://api.digitalocean.com/v2/apps/' + $env:DO_APP_ID) -Body $restoreBody | Out-Null
            throw 'post-change HTTP verification failed; original spec restored'
          }
