name: Scanner V2 Stage 4 validation

on:
  push:
    branches:
      - feat/scanner-v2-stage4-content-corpus-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage4-content-corpus
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage 4 targeted tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/scanner-v2-content.test.ts             packages/onboarding-ingest/src/scanner-v2-foundation.test.ts             packages/onboarding-ingest/src/scanner-v2-discovery.test.ts             packages/onboarding-ingest/src/scanner-v2-url-policy.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx eslint             packages/onboarding-ingest/src/scanner-v2-content.ts             packages/onboarding-ingest/src/scanner-v2-content.test.ts             packages/onboarding-ingest/src/index.ts
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Prove additive boundary
        shell: bash
        run: |
          set -euo pipefail
          base="bce72c86fa0cb1b43f72ca90bdc881204e0fdaea"
          git diff --exit-code "$base"...HEAD --             packages/onboarding-ingest/src/scan.ts             packages/onboarding-ingest/src/fetch-safe.ts             packages/onboarding-ingest/src/server.ts             packages/onboarding-ingest/packages/website/scan/bundle.cjs
          echo "SCANNER_V1_RUNTIME_SOURCE_UNCHANGED=PASS"
          echo "SCANNER_V2_PRODUCTION_ROUTE_UNCHANGED=PASS"
          echo "GOLDEN_PHONE_LINE_CHANGE_SURFACE=0"
