name: PR148 temporary hosted validation

on:
  push:
    branches:
      - fix/onboarding-scan-address-failover-20261001

permissions:
  contents: read

concurrency:
  group: pr148-temporary-hosted-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact PR candidate in isolated container
        run: |
          set -euo pipefail
          docker run --rm --shm-size=1g -v "$PWD:/src:ro" node:24-bookworm bash -lc '
            set -euo pipefail
            cp -a /src /work
            cd /work
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium >/dev/null
            npm ci
            npm test
            npm run accessibility:check
            npx eslint packages/onboarding-ingest/src/fetch-safe.ts packages/onboarding-ingest/src/fetch-safe.test.ts packages/sandbox-test-call/src/scripted.ts packages/sandbox-test-call/src/scripted.test.ts packages/sandbox-test-call/src/types.ts
            npx tsc --noEmit
            NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan npm run build
            test "$(find out -name index.html -type f | wc -l)" -ge 28
            test -f out/robots.txt
            test -f out/sitemap.xml
            BROWSER_PATH=/usr/bin/chromium npm run browser:smoke
            BROWSER_PATH=/usr/bin/chromium NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan node scripts/create-mobile-stability-browser.mjs
          '
