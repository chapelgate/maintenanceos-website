name: MaintenanceOS Cloud CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: maintenanceos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  primary-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      container_changed: ${{ steps.changes.outputs.container_changed }}
      staging_changed: ${{ steps.changes.outputs.staging_changed }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject obvious committed private keys and provider secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- ':!*.example' ':!*.md' '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|AC[a-fA-F0-9]{32}|SK[a-fA-F0-9]{32})'; then
            echo 'Potential secret material found in tracked source.' >&2
            exit 1
          fi
          echo 'No obvious provider/private-key secret patterns found.'

      - name: Classify expensive checks by changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          container_changed=true
          staging_changed=true
          files=""

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            files="$(git diff --name-only "$base...$head")"
            container_changed=false
            staging_changed=false
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}")"
            container_changed=false
            staging_changed=false
          fi

          if [ -n "$files" ]; then
            if printf '%s\n' "$files" | grep -Eq '^(Dockerfile|requirements\.txt|\.dockerignore|\.github/workflows/cloud-ci\.yml)$'; then
              container_changed=true
            fi
            if printf '%s\n' "$files" | grep -Eq '^(docker-compose\.staging\.yml|\.env\.staging\.example|\.github/workflows/cloud-ci\.yml)$'; then
              staging_changed=true
            fi
          fi

          echo "container_changed=$container_changed" >> "$GITHUB_OUTPUT"
          echo "staging_changed=$staging_changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Compile source tree
        run: python -m compileall -q .

      - name: Run deterministic test suite
        run: timeout 180s pytest -vv -x -k 'not test_local_tls_https_and_wss_transport_reaches_actual_routes'

      - name: Run TLS/WSS transport probe with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "TLS/WSS transport probe attempt ${attempt}/3"
            if pytest -q tests/test_staged_voice_routes.py::test_local_tls_https_and_wss_transport_reaches_actual_routes; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "TLS/WSS transport probe failed three times." >&2
              exit 1
            fi
            sleep 1
          done

  compatibility-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q .
      - name: Compatibility regression suite
        run: timeout 180s pytest -q -x -k 'not test_local_tls_https_and_wss_transport_reaches_actual_routes'

  staging-config:
    needs: primary-test
    if: needs.primary-test.outputs.staging_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://maintenanceos:synthetic@db.invalid:5432/maintenanceos
      APP_SECRET: ci-synthetic-app-secret-not-for-runtime
      INTERNAL_API_TOKEN: ci-synthetic-internal-token-not-for-runtime
      INTERNAL_API_CLIENT_ID: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked-down staging compose configuration
        run: docker compose -f docker-compose.staging.yml config > staging-compose-rendered.yml
      - name: Assert provider ingress and live channels remain disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ENABLE_PUBLIC_PROVIDER_INGRESS: "false"' staging-compose-rendered.yml
          grep -q 'ENABLE_REALTIME_VOICE: "false"' staging-compose-rendered.yml
          grep -q 'ENABLE_LIVE_EMAIL: "false"' staging-compose-rendered.yml
          grep -q 'ENABLE_LIVE_MESSAGING: "false"' staging-compose-rendered.yml
          grep -q 'ALLOW_REMOTE_AI_SIDE_EFFECT_ENABLE: "false"' staging-compose-rendered.yml
      - name: Remove rendered config containing synthetic values
        if: always()
        run: rm -f staging-compose-rendered.yml

  container-build:
    needs: primary-test
    if: needs.primary-test.outputs.container_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t maintenanceos:${{ github.sha }} .
      - name: Verify non-root runtime contract
        run: test "$(docker image inspect maintenanceos:${{ github.sha }} --format '{{.Config.User}}')" = "maintenanceos"
      - name: Smoke-test production container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name maintenanceos-smoke \
            -p 127.0.0.1:18000:8000 \
            -e ENABLE_REALTIME_VOICE=false \
            -e DATABASE_URL=sqlite:////tmp/maintenanceos-smoke.db \
            maintenanceos:${{ github.sha }}
          trap 'docker logs maintenanceos-smoke || true; docker stop maintenanceos-smoke || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:18000/health"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      payload = json.load(response)
                  if response.status == 200 and payload.get("ok") is True and payload.get("realtime_voice") is False:
                      break
                  raise RuntimeError(f"unexpected health payload: {payload!r}")
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"container health check failed: {last_error}")
          PY
      - name: Record image metadata
        run: docker image inspect maintenanceos:${{ github.sha }} > maintenanceos-image-inspect.json
      - uses: actions/upload-artifact@v4
        with:
          name: maintenanceos-image-metadata-${{ github.sha }}
          path: maintenanceos-image-inspect.json
          retention-days: 7
