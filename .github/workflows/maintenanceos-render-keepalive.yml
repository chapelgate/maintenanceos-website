name: MaintenanceOS Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep controlled-call service warm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://maintenanceos-redteam-v2.onrender.com/health \
            --output /dev/null
