name: Scanner V2 Stage 6 grounding validation

on:
  push:
    branches:
      - feat/scanner-v2-stage6-grounding-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage6-grounding
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage 4-6 targeted tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/scanner-v2-content.test.ts             packages/onboarding-ingest/src/scanner-v2-retrieval.test.ts             packages/onboarding-ingest/src/scanner-v2-grounding.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Prove additive boundary
        shell: bash
        run: |
          set -euo pipefail
          base="6e4fe49c8c897589607c6f4f5c2b37133196643f"
          git diff --exit-code "$base"...HEAD --             packages/onboarding-ingest/src/scan.ts             packages/onboarding-ingest/src/fetch-safe.ts             packages/onboarding-ingest/packages/website/scan/bundle.cjs             packages/sandbox-test-call/src             src/components             src/lib
          echo "SCANNER_V1_RUNTIME_UNCHANGED=PASS"
          echo "BROWSER_PREVIEW_RUNTIME_UNCHANGED=PASS"
          echo "GOLDEN_PHONE_LINE_CHANGE_SURFACE=0"
