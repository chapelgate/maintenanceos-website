name: Scanner V2 Stage 11 validation

on:
  push:
    branches:
      - feat/scanner-v2-stage11-operational-ui-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage11-operational-ui
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage 11 targeted status tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/scanner-v2-status.test.ts             packages/onboarding-ingest/src/scanner-v2-worker.test.ts             packages/onboarding-ingest/src/scanner-v2-refresh.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Stage 11 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Website knowledge partial' packages/onboarding-ingest/src/scanner-v2-status.ts
          grep -q 'must not be presented as having learned the whole site' src/components/ScannerV2CrawlStatus.tsx
          grep -q 'data-scanner-v2-state' src/components/ScannerV2CrawlStatus.tsx
          grep -q 'View crawl sources' src/components/ScannerV2CrawlStatus.tsx
          git diff --exit-code bdf22a59138b7fa002bd2e01ebf4b2c8c7a115e0...HEAD --             packages/onboarding-ingest/src/scan.ts             packages/onboarding-ingest/packages/website/scan/bundle.cjs             packages/sandbox-test-call             packages/provisioning-gateway
          echo "SCANNER_V2_STAGE11_UI_CONTRACT=PASS"
          echo "PRODUCTION_SCANNER_AND_PHONE_SURFACE_UNCHANGED=PASS"
