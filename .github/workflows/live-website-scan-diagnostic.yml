name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory public WordPress business pages
        shell: bash
        run: |
          set -euo pipefail
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'
          curl -sS -A "$ua" \
            'https://alleygates.co.uk/wp-json/wp/v2/pages?per_page=20&_fields=link,title,content,excerpt,slug' \
            -o /tmp/pages.json
          python3 - <<'PY'
          import html, json, re
          pages=json.load(open('/tmp/pages.json'))
          for p in pages:
              title=html.unescape(re.sub(r'<[^>]+>',' ',p.get('title',{}).get('rendered','')))
              body=' '.join([
                  p.get('excerpt',{}).get('rendered',''),
                  p.get('content',{}).get('rendered','')
              ])
              body=html.unescape(re.sub(r'<script\b[\s\S]*?</script>',' ',body,flags=re.I))
              body=html.unescape(re.sub(r'<style\b[\s\S]*?</style>',' ',body,flags=re.I))
              body=html.unescape(re.sub(r'<[^>]+>',' ',body))
              body=re.sub(r'\s+',' ',body).strip()
              print('---')
              print('SLUG',p.get('slug'))
              print('TITLE',title.strip())
              print('LINK',p.get('link'))
              print('TEXT',body[:1200])
          PY
