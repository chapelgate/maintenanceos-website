name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read website App Platform deployment wiring only
        shell: bash
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DIGITALOCEAN_ACCESS_TOKEN"
          app_id="98e3a9c0-3b3c-48eb-ac72-2b13ffbe2661"
          api="https://api.digitalocean.com/v2/apps/$app_id"
          curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_ACCESS_TOKEN" "$api" -o /tmp/app.json
          python3 - <<'PY'
          import json
          app=json.load(open('/tmp/app.json'))['app']
          spec=app.get('spec') or {}
          print('APP_ID='+str(app.get('id')))
          print('APP_NAME='+str(spec.get('name')))
          print('STATIC_SITES='+json.dumps([
            {'name':x.get('name'),'github':{k:(x.get('github') or {}).get(k) for k in ('repo','branch','deploy_on_push')}}
            for x in spec.get('static_sites') or []
          ],separators=(',',':')))
          print('FUNCTIONS='+json.dumps([
            {'name':x.get('name'),'source_dir':x.get('source_dir'),'github':{k:(x.get('github') or {}).get(k) for k in ('repo','branch','deploy_on_push')}}
            for x in spec.get('functions') or []
          ],separators=(',',':')))
          active=app.get('active_deployment') or {}
          print('ACTIVE='+json.dumps({
            'id':active.get('id'),'phase':active.get('phase'),
            'functions':[{'name':x.get('name'),'source_commit_hash':x.get('source_commit_hash'),'namespace':x.get('namespace')} for x in active.get('functions') or []],
            'static_sites':[{'name':x.get('name'),'source_commit_hash':x.get('source_commit_hash')} for x in active.get('static_sites') or []],
          },separators=(',',':')))
          PY
