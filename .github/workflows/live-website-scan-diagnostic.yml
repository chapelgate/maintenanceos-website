name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Alley Gates WordPress REST CORS
        shell: bash
        run: |
          set -euo pipefail
          origin="https://seahorse-app-4oasq.ondigitalocean.app"
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'
          api='https://alleygates.co.uk/wp-json/wp/v2/pages?per_page=20&_fields=link,title,content,excerpt,slug'

          echo "=== OPTIONS ==="
          curl -sS -D /tmp/oh -o /tmp/ob -X OPTIONS "$api" \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: accept' \
            -A "$ua" || true
          sed -n '1,80p' /tmp/oh
          cat /tmp/ob || true
          echo

          echo "=== GET WITH ORIGIN ==="
          code="$(curl -sS -D /tmp/gh -o /tmp/gb -w '%{http_code}' "$api" \
            -H "Origin: $origin" \
            -H 'Accept: application/json' \
            -A "$ua" || true)"
          echo "HTTP_STATUS=$code"
          sed -n '1,80p' /tmp/gh
          echo "BODY_BYTES=$(wc -c < /tmp/gb)"
          echo "BODY_FIRST_2000"
          head -c 2000 /tmp/gb || true
          echo

          echo "=== MATCH TERMS ==="
          python3 - <<'PY'
          import json, re
          data=json.load(open('/tmp/gb'))
          text='\n'.join(
              (x.get('title',{}).get('rendered','')+' '+
               x.get('excerpt',{}).get('rendered','')+' '+
               x.get('content',{}).get('rendered',''))
              for x in data
          )
          clean=re.sub(r'<[^>]+>',' ',text)
          clean=re.sub(r'\s+',' ',clean)
          for term in ['Alley Gate','CCTV','Security Fencing','key','keys','master key']:
              print(term, bool(re.search(re.escape(term), clean, re.I)))
          print('PAGES',len(data))
          print('TEXT_CHARS',len(clean))
          PY
