name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect bounded same-origin SPA assets
        shell: bash
        run: |
          set -euo pipefail
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'
          base='https://expressgasdelivery.com'
          js='/static/js/main.79e19d85.js'
          curl -sS -A "$ua" -D /tmp/h -o /tmp/js "$base$js"
          wc -c /tmp/js
          sed -n '1,25p' /tmp/h
          for needle in 'Opening Times' 'Monday' 'Butane Gas' 'Propane Gas' 'Beer Gas' 'Free Local Delivery' '0151 487 0570' 'Liverpool'; do
            echo "--- $needle ---"
            grep -F -o -m 5 ".\{0,160\}$needle.\{0,260\}" /tmp/js || true
          done
