name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe same-domain paths through live DigitalOcean function
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://seahorse-app-4oasq.ondigitalocean.app/api/website/scan"
          for target in \
            "https://alleygates.co.uk/" \
            "https://alleygates.co.uk/robots.txt" \
            "https://alleygates.co.uk/wp-sitemap.xml" \
            "https://alleygates.co.uk/wp-json/" \
            "https://www.alleygates.co.uk/"; do
            echo "=== $target ==="
            code="$(curl -sS -o /tmp/b -D /tmp/h -w '%{http_code}' \
              -X POST "$endpoint" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data-binary "{\"url\":\"$target\"}" || true)"
            echo "HTTP_STATUS=$code"
            sed -n '1,20p' /tmp/h
            cat /tmp/b
            echo
          done
