name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove existing extractor on WordPress REST payload
        shell: bash
        run: |
          set -euo pipefail
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'
          curl -sS -A "$ua" \
            'https://alleygates.co.uk/wp-json/wp/v2/pages?per_page=20&_fields=link,title,content,excerpt,slug' \
            -o /tmp/pages.json
          curl -sS -A "$ua" 'https://alleygates.co.uk/wp-json/' -o /tmp/site.json

          cat >/tmp/probe.ts <<'TS'
          import fs from "node:fs";
          const mod = await import("file://" + process.env.GITHUB_WORKSPACE + "/packages/onboarding-ingest/src/extract.ts");
          const extractDraftFromHtml = mod.extractDraftFromHtml;

          const pages = JSON.parse(fs.readFileSync("/tmp/pages.json","utf8"));
          const site = JSON.parse(fs.readFileSync("/tmp/site.json","utf8"));
          const synthetic = [
            { url: "https://alleygates.co.uk/", html: "" },
            ...pages.slice(0,20).map((page:any) => ({
              url: typeof page.link === "string" ? page.link : "https://alleygates.co.uk/",
              html:
                "<title>" +
                String(page?.title?.rendered ?? "") +
                "</title>" +
                String(page?.excerpt?.rendered ?? "") +
                String(page?.content?.rendered ?? ""),
            })),
          ];
          const result = extractDraftFromHtml(synthetic);
          if (typeof site?.name === "string" && site.name.trim()) {
            result.draft.businessName = site.name.trim();
            result.facts.businessName = site.name.trim();
          }
          console.log(JSON.stringify({
            draft: result.draft,
            facts: result.facts,
            fieldMeta: result.fieldMeta,
            warnings: result.warnings
          }, null, 2));
          TS
          node --experimental-strip-types /tmp/probe.ts > /tmp/result.json
          cat /tmp/result.json
          grep -qi 'Alley Gates' /tmp/result.json
          grep -Eqi 'CCTV|Security Fencing|Gate Installation|key' /tmp/result.json
