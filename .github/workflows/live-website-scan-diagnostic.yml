name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover public SPA data endpoints
        shell: bash
        run: |
          set -euo pipefail
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'
          js='https://expressgasdelivery.com/static/js/main.79e19d85.js'
          curl -sS -A "$ua" -o /tmp/js "$js"

          python3 - <<'PY'
          import re
          text=open('/tmp/js','r',encoding='utf-8',errors='replace').read()
          urls=sorted(set(re.findall(r'https?://[^"\x27\\<> )]+', text)))
          for u in urls[:300]:
              print(u[:500])
          print('URL_COUNT',len(urls))
          print('--- LIKELY TOKENS ---')
          for token in ['firebase','firestore','supabase','api/','axios','fetch(','products','opening','hours','deliveryAreas','businessHours']:
              hits=[m.start() for m in re.finditer(re.escape(token),text,re.I)]
              print(token, len(hits))
              for i in hits[:5]:
                  print(text[max(0,i-180):i+400])
          PY
