name: Live website scan diagnostic

on:
  push:
    branches:
      - diag/live-website-scan-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove hostname-plus-pinned-lookup transport
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require('node:https');

          function probe(label, options) {
            return new Promise(resolve => {
              console.log('=== '+label+' ===');
              const req = https.request({
                ...options,
                port: 443,
                path: '/',
                method: 'GET',
                headers: {
                  'User-Agent': 'MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)',
                  Accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,text/plain;q=0.8,*/*;q=0.1',
                  'Accept-Language': 'en-GB,en;q=0.8',
                  'Accept-Encoding': 'identity',
                  Connection: 'close'
                },
                timeout: 8000
              }, res => {
                let body='';
                res.setEncoding('utf8');
                res.on('data', c => body += c);
                res.on('end', () => {
                  console.log('STATUS='+res.statusCode);
                  console.log('SERVER='+(res.headers.server||''));
                  console.log('VIA='+(res.headers['x-via']||''));
                  console.log(body.slice(0,120).replace(/\s+/g,' '));
                  resolve();
                });
              });
              req.on('timeout',()=>req.destroy(new Error('timeout')));
              req.on('error',err=>{ console.log('ERROR='+err.message); resolve(); });
              req.end();
            });
          }

          (async () => {
            const ip='185.151.30.131';
            await probe('HOSTNAME DEFAULT DNS', { hostname: 'alleygates.co.uk' });
            await probe('HOSTNAME PINNED LOOKUP', {
              hostname: 'alleygates.co.uk',
              servername: 'alleygates.co.uk',
              lookup: (_hostname, _options, callback) => callback(null, ip, 4)
            });
            await probe('RAW IP WITH HOST/SNI', {
              host: ip,
              servername: 'alleygates.co.uk',
              headers: undefined
            });
          })();
          NODE
