name: WebKit Accessibility Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  webkit-a11y:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, estate]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$PWD"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Start local server
        run: nohup npx serve out -l 3000 > "$RUNNER_TEMP/webkit-server.log" 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/webkit-server.log"
          exit 1

      - name: Run WebKit accessibility tests
        run: |
          docker run --rm --ipc=host --network=host \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            npx playwright test tests/webkit-a11y/ --config playwright-webkit-a11y.config.ts

      - name: Stop local server
        if: always()
        run: pkill -f "serve out -l 3000" || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-a11y-report
          path: playwright-report/
