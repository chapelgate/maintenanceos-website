name: Instinct worker phone proof
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Place one controlled call to the dedicated MOS test number"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: instinct-worker-phone-proof
  cancel-in-progress: false

jobs:
  phone-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      TWILIO_HUMAN_TRANSFER_NUMBER: ${{ secrets.TWILIO_HUMAN_TRANSFER_NUMBER }}
    steps:
      - name: Refuse unless explicitly armed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.execute }}" = "true" || { echo "PHONE_PROOF=NOT_ARMED"; exit 2; }

      - name: Place one isolated test-number call
        shell: python
        run: |
          import base64, hashlib, json, os, time, urllib.parse, urllib.request

          def ref(value):
              return "sha256:" + hashlib.sha256((value or "").encode()).hexdigest()[:16]

          account=(os.getenv("TWILIO_ACCOUNT_SID") or "").strip()
          token=(os.getenv("TWILIO_AUTH_TOKEN") or "").strip()
          target=(os.getenv("TWILIO_PHONE_NUMBER") or "").strip()
          candidates=[
              (os.getenv("TWILIO_FROM_NUMBER") or "").strip(),
              (os.getenv("TWILIO_HUMAN_TRANSFER_NUMBER") or "").strip(),
          ]
          source=next((value for value in candidates if value and value != target), "")
          if not account or not token or not target:
              raise SystemExit("PHONE_PROOF_BLOCKED: missing existing Twilio secrets")
          if not source:
              raise SystemExit("PHONE_PROOF_BLOCKED: no existing distinct From number")

          auth="Basic "+base64.b64encode(f"{account}:{token}".encode()).decode()
          base=f"https://api.twilio.com/2010-04-01/Accounts/{account}/Calls.json"
          twiml="<Response><Say>Chapelgate Instinct worker phone capability test.</Say><Pause length=\"1\"/><Hangup/></Response>"
          body=urllib.parse.urlencode({"To":target,"From":source,"Twiml":twiml,"Timeout":"20"}).encode()
          req=urllib.request.Request(base,data=body,method="POST",headers={
              "Authorization":auth,
              "Content-Type":"application/x-www-form-urlencoded",
          })
          with urllib.request.urlopen(req,timeout=30) as response:
              created=json.loads(response.read().decode())
          call_sid=str(created.get("sid") or "")
          if not call_sid:
              raise SystemExit("PHONE_PROOF_FAIL: missing call reference")

          terminal={"completed","busy","no-answer","canceled","failed"}
          status=str(created.get("status") or "").lower()
          detail=f"https://api.twilio.com/2010-04-01/Accounts/{account}/Calls/{call_sid}.json"
          deadline=time.time()+75
          while status not in terminal and time.time()<deadline:
              time.sleep(3)
              lookup=urllib.request.Request(detail,headers={"Authorization":auth})
              with urllib.request.urlopen(lookup,timeout=20) as response:
                  status=str(json.loads(response.read().decode()).get("status") or "").lower()

          passed=status=="completed"
          print(json.dumps({
              "PHONE_PROOF":"PASS" if passed else "FAIL",
              "provider":"twilio",
              "real_call_resource_created":True,
              "terminal_status":status,
              "test_number_ref":ref(target),
              "from_number_ref":ref(source),
              "call_ref":ref(call_sid),
              "webhook_changed":False,
              "render_used":False,
              "golden_line_touched":False,
              "secret_values_logged":False,
          },sort_keys=True))
          raise SystemExit(0 if passed else 1)
