name: Scanner V2 SSH secret presence

on:
  push:
    branches:
      - ops/scanner-v2-existing-secret-probe-20261005
    paths:
      - ".github/workflows/scanner-v2-secret-presence.yml"

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report presence only
        shell: bash
        env:
          DROPLET_SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MAINTENANCEOS_SSH_PRIVATE_KEY: ${{ secrets.MAINTENANCEOS_SSH_PRIVATE_KEY }}
          MAINTENANCEOS_RECOVERY_SSH_PRIVATE_KEY: ${{ secrets.MAINTENANCEOS_RECOVERY_SSH_PRIVATE_KEY }}
          RECOVERY_SSH_PRIVATE_KEY: ${{ secrets.RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          for n in DROPLET_SSH_PRIVATE_KEY DEPLOY_SSH_KEY DEPLOY_SSH_PRIVATE_KEY SSH_PRIVATE_KEY MAINTENANCEOS_SSH_PRIVATE_KEY MAINTENANCEOS_RECOVERY_SSH_PRIVATE_KEY RECOVERY_SSH_PRIVATE_KEY; do
            if [[ -n "${!n:-}" ]]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
