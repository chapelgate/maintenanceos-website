name: PR154 live mobile acceptance

on:
  push:
    branches:
      - diag/post-pr154-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for exact release and exercise fresh mobile journeys
        env:
          LIVE_ORIGIN: https://seahorse-app-4oasq.ondigitalocean.app
          EXPECTED_SHA: 1f8e6b34e35a68e52ea179b4332bb5c2be6117dc
        shell: bash
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          for i in $(seq 1 60); do
            curl -fsS "$origin/release.json" -o /tmp/release.json || true
            deployed="$(python3 -c "import json; print(json.load(open('/tmp/release.json')).get('commit',''))" 2>/dev/null || true)"
            echo "release_attempt=$i deployed=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 8
          done
          deployed="$(python3 -c "import json; print(json.load(open('/tmp/release.json')).get('commit',''))")"
          test "$deployed" = "$EXPECTED_SHA"
          cat /tmp/release.json

          cat > .pr154-live.mjs <<'NODE'
          import { chromium } from 'playwright';

          const origin = process.env.LIVE_ORIGIN;
          const expectedSha = process.env.EXPECTED_SHA;
          const release = await fetch(origin + '/release.json').then(r => r.json());
          if (release.commit !== expectedSha) throw new Error('release mismatch');

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox','--disable-dev-shm-usage'],
          });

          async function runCase({name,url,expectedService}) {
            const context = await browser.newContext({
              viewport: {width:390,height:844},
              deviceScaleFactor:3,
              isMobile:true,
            });
            const page = await context.newPage();
            const exceptions = [];
            const leadRequests = [];
            page.on('pageerror', e => exceptions.push(String(e)));
            page.on('request', request => {
              const u=request.url();
              if (u.includes('/v1/public/website-leads') || u.includes('127.0.0.1:8787/leads')) {
                leadRequests.push({url:u,method:request.method()});
              }
            });

            let scanJson=null;
            page.on('response', async response => {
              if (!response.url().includes('/api/website/scan')) return;
              try { scanJson=await response.json(); } catch {}
            });

            await page.goto(origin+'/create/', {waitUntil:'networkidle',timeout:45000});
            await page.locator('input[name="businessUrl"]').fill(url);
            await page.locator('input[name="name"]').fill('Live Acceptance');
            await page.locator('input[name="email"]').fill('live-acceptance@example.com');
            await page.locator('input[name="organisation"]').fill('Chapelgate');
            await page.locator('[data-create-primary-action]').click();

            await page.waitForSelector('[data-create-step="2"]');
            await page.waitForFunction(() => {
              const b=document.querySelector('[data-create-step="2"] [data-create-primary-action]');
              return Boolean(b && !b.disabled && (b.textContent||'').trim() !== 'Checking…');
            }, null, {timeout:45000});

            if (!scanJson?.ok) throw new Error(name+' live scan failed: '+JSON.stringify(scanJson));
            if (!JSON.stringify(scanJson).toLowerCase().includes(expectedService.toLowerCase())) {
              throw new Error(name+' scanner omitted '+expectedService);
            }
            await page.locator('[data-create-step="2"] [data-create-primary-action]').click();

            await page.waitForSelector('[data-create-step="3"]');
            await page.locator('[data-agent-type="receptionist"] input').check();
            await page.locator('[data-create-step="3"] [data-create-primary-action]').click();

            await page.waitForSelector('[data-create-step="4"]');
            const services = await page.getByLabel('Services').inputValue();
            if (!services.toLowerCase().includes(expectedService.toLowerCase())) {
              throw new Error(name+' Step 4 lost '+expectedService+': '+services);
            }
            const greeting=page.getByLabel('Greeting');
            if (!(await greeting.inputValue()).trim()) {
              await greeting.fill('Thank you for calling '+name+'. How can I help?');
            }
            const hours=page.getByLabel('Hours');
            if (!(await hours.inputValue()).trim()) {
              await hours.fill('Monday-Friday 09:00-17:00');
            }
            await page.locator('[data-create-step="4"] [data-create-primary-action]').click();

            await page.waitForSelector('[data-create-step="5"]');
            await page.waitForSelector('[data-final-knowledge-pack="readonly"]',{state:'attached',timeout:15000});
            const pack=(await page.locator('[data-final-knowledge-pack="readonly"]').textContent())||'';
            if (!pack.toLowerCase().includes(expectedService.toLowerCase())) {
              throw new Error(name+' normalized pack lost '+expectedService);
            }

            await page.getByRole('button',{name:'Start voice call'}).click();

            await page.getByRole('button',{name:'What services do you offer?'}).click();
            await page.waitForFunction(
              expected => (document.querySelector('[data-demo-transcript]')?.textContent||'').toLowerCase().includes(expected.toLowerCase()),
              expectedService,
              {timeout:15000}
            );

            const input=page.getByLabel('Or type what the caller would say');
            await input.fill('What do you do');
            await page.getByRole('button',{name:'Send'}).click();
            await page.waitForTimeout(150);

            await input.fill('I want to speak to a human.');
            await page.getByRole('button',{name:'Send'}).click();
            await page.waitForFunction(() => {
              const t=document.querySelector('[data-demo-transcript]')?.textContent||'';
              return /can't transfer this browser preview/i.test(t);
            }, null, {timeout:10000});

            const transcript=await page.locator('[data-demo-transcript]').innerText();
            if (!transcript.toLowerCase().includes(expectedService.toLowerCase())) {
              throw new Error(name+' transcript lost '+expectedService);
            }
            if (/scripted sandbox|frozen production telephony|in this knowledge pack/i.test(transcript)) {
              throw new Error(name+' leaked engineering terminology: '+transcript);
            }
            if (!/can't transfer this browser preview/i.test(transcript)) {
              throw new Error(name+' human-transfer wording not customer-safe');
            }
            if (leadRequests.length) throw new Error(name+' submitted lead before Save: '+JSON.stringify(leadRequests));
            if (exceptions.length) throw new Error(name+' runtime exceptions: '+exceptions.join(' | '));

            console.log(JSON.stringify({
              name,
              scanService:true,
              step4Service:true,
              normalizedPackService:true,
              servicesReply:true,
              naturalWhatDoYouDo:true,
              humanWordingSafe:true,
              engineeringTerminologyLeak:false,
              leadRequestsBeforeSave:leadRequests.length,
              runtimeExceptions:exceptions.length,
            }));
            await context.close();
          }

          try {
            await runCase({
              name:'Express Gas Delivery',
              url:'https://expressgasdelivery.com/',
              expectedService:'Propane Gas Cylinders',
            });
            await runCase({
              name:'Alley Gates',
              url:'https://alleygates.co.uk/',
              expectedService:'Alley Gate Installation',
            });
            console.log('PR154_LIVE_MOBILE_ACCEPTANCE=PASS');
          } finally {
            await browser.close();
          }
          NODE
          node .pr154-live.mjs
