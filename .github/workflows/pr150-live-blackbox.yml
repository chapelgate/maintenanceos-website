name: PR150 live black-box verification

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live scanner responses without early exit
        shell: bash
        run: |
          set -euo pipefail
          origin="https://seahorse-app-4oasq.ondigitalocean.app"

          echo "=== RELEASE ==="
          curl -sS "$origin/release.json"
          echo

          probe() {
            name="$1"; url="$2"
            echo "=== $name ==="
            for i in 1 2 3; do
              status="$(curl -sS -o /tmp/body -D /tmp/head -w '%{http_code}' \
                -X POST "$origin/api/website/scan" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                --data-binary "{\"url\":\"$url\"}" || true)"
              echo "ATTEMPT=$i HTTP_STATUS=$status"
              sed -n '1,25p' /tmp/head
              echo "--- BODY ---"
              cat /tmp/body
              echo
            done
          }

          probe "EXAMPLE" "https://example.com/"
          probe "ALLEY GATES" "https://alleygates.co.uk/"
          probe "EXPRESS GAS" "https://expressgasdelivery.com/"
