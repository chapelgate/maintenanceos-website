name: PR151 live black-box verification

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact deployment and verify both real sites
        shell: bash
        run: |
          set -euo pipefail
          origin="https://seahorse-app-4oasq.ondigitalocean.app"
          expected="c16c647858613fc07f77eb4947eae88460654db8"

          echo "=== WAIT FOR RELEASE ==="
          deployed=""
          for i in $(seq 1 60); do
            curl -fsS "$origin/release.json" -o /tmp/release.json || true
            deployed="$(python3 - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/release.json')).get('commit',''))
          except Exception:
              print('')
          PY
          )"
            echo "attempt=$i deployed=$deployed"
            if [ "$deployed" = "$expected" ]; then
              break
            fi
            sleep 10
          done
          test "$deployed" = "$expected"
          cat /tmp/release.json
          echo

          probe() {
            name="$1"; url="$2"; outfile="$3"
            echo "=== $name ==="
            for i in 1 2 3; do
              status="$(curl -sS -o "$outfile" -D /tmp/head -w '%{http_code}'                 -X POST "$origin/api/website/scan"                 -H 'Content-Type: application/json'                 -H 'Accept: application/json'                 --data-binary "{\"url\":\"$url\"}" || true)"
              echo "ATTEMPT=$i HTTP_STATUS=$status"
              cat "$outfile"
              echo
              test "$status" = "200"
            done
          }

          probe "ALLEY GATES" "https://alleygates.co.uk/" /tmp/alley.json
          probe "EXPRESS GAS" "https://expressgasdelivery.com/" /tmp/gas.json

          python3 - <<'PY'
          import json
          alley=json.load(open('/tmp/alley.json'))
          gas=json.load(open('/tmp/gas.json'))

          assert alley.get('ok') is True, alley
          alley_blob=json.dumps(alley).lower()
          for term in ['alley gate','cctv','security fencing']:
              assert term in alley_blob, (term, alley)

          assert gas.get('ok') is True, gas
          gd=gas.get('draft') or {}
          assert (gd.get('hours') or '').strip(), gas
          assert (gd.get('services') or '').strip(), gas
          gas_blob=json.dumps(gas).lower()
          for term in ['propane','patio gas']:
              assert term in gas_blob, (term, gas)

          print('DEPLOYED_COMMIT_VERIFIED=PASS')
          print('ALLEY_GATE_KNOWLEDGE=PASS')
          print('EXPRESS_GAS_KNOWLEDGE=PASS')
          print('LIVE_SCANNER_BLACK_BOX=PASS')
          PY
