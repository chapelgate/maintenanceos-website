name: PR150 live black-box verification

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace Node pinned lookup behavior for public hosts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns = require('node:dns').promises;
          const https = require('node:https');
          const { isIP } = require('node:net');

          async function trace(hostname) {
            console.log('=== '+hostname+' ===');
            const records = await dns.lookup(hostname,{all:true,verbatim:true});
            console.log('DNS='+JSON.stringify(records));
            for (const rec of records) {
              const ip=rec.address;
              const family=isIP(ip);
              await new Promise(resolve => {
                const req=https.request({
                  hostname,
                  port:443,
                  path:'/',
                  method:'GET',
                  family,
                  autoSelectFamily:false,
                  servername:hostname,
                  headers:{
                    Host:hostname,
                    'User-Agent':'MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)',
                    Accept:'text/html,application/xhtml+xml,application/xml;q=0.9,text/plain;q=0.8,*/*;q=0.1',
                    'Accept-Language':'en-GB,en;q=0.8',
                    'Accept-Encoding':'identity',
                    Connection:'close'
                  },
                  lookup:(h,options,cb)=>{
                    console.log('LOOKUP host='+h+' ip='+ip+' family='+family+' options='+JSON.stringify(options));
                    if (typeof options === 'object' && options && options.all) {
                      cb(null,[{address:ip,family}]);
                    } else {
                      cb(null,ip,family);
                    }
                  },
                  timeout:5000
                },res=>{
                  let n=0;
                  res.on('data',c=>n+=c.length);
                  res.on('end',()=>{console.log('RESULT ip='+ip+' status='+res.statusCode+' bytes='+n+' server='+(res.headers.server||''));resolve();});
                });
                req.on('timeout',()=>req.destroy(new Error('timeout')));
                req.on('error',e=>{console.log('ERROR ip='+ip+' '+e.message);resolve();});
                req.end();
              });
            }
          }

          (async()=>{
            await trace('example.com');
            await trace('alleygates.co.uk');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
