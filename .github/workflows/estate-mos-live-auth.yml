# Phrase-gated live MOS authenticated proof via already-authorised MOS secrets.
# Never prints secret values. Does not place Twilio calls.
name: Estate MOS live auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/estate-mos-live-auth.yml"

concurrency:
  group: estate-mos-live-auth
  cancel-in-progress: false

jobs:
  mos-live:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[execute-mos-live-auth]'))
    runs-on: [self-hosted, Linux, X64, chapelgate, estate-trusted, estate-recovery]
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      MOS_URL: https://maintenanceos-redteam-v2.onrender.com
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dahhskafngtc739pnplg
    steps:
      - name: Prove MOS authenticated /readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/estate-mos-live-auth.txt
          import json, os, urllib.error, urllib.request

          def log(msg):
              print(msg, flush=True)

          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      raw = resp.read()
                      try:
                          body = json.loads(raw.decode()) if raw else {}
                      except Exception:
                          body = {}
                      return resp.status, body
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      body = json.loads(raw.decode()) if raw else {}
                  except Exception:
                      body = {}
                  return exc.code, body
              except Exception as exc:
                  return 0, {"detail": type(exc).__name__}

          log("estate_mos_live_auth=start")
          log("operator_credential_entry=false")
          log("secret_redacted=true")
          log(f"run_id={os.environ.get('GITHUB_RUN_ID','')}")
          token = (os.environ.get("INTERNAL_API_TOKEN") or os.environ.get("APP_SECRET") or "").strip()
          log(f"internal_token_present={'yes' if token else 'no'}")
          render = (os.environ.get("RENDER_API_KEY") or "").strip()
          log(f"render_secret_present={'yes' if render else 'no'}")
          if render:
              st, env_vars = fetch(
                  f"https://api.render.com/v1/services/{os.environ['RENDER_SERVICE_ID']}/env-vars",
                  {"Authorization": f"Bearer {render}", "Accept": "application/json"},
              )
              log(f"render_env_http={st}")
              items = env_vars if isinstance(env_vars, list) else env_vars.get("envVars") or []
              names = []
              for item in items:
                  env = item.get("envVar") if isinstance(item.get("envVar"), dict) else item
                  if not isinstance(env, dict):
                      continue
                  key = env.get("key") or env.get("name")
                  if key:
                      names.append(str(key))
                  if key == "INTERNAL_API_TOKEN":
                      token = str(env.get("value") or "")
              log("render_env_names=" + ",".join(sorted(names)))
          url = os.environ["MOS_URL"].rstrip("/") + "/readiness"
          if token:
              st, body = fetch(url, {"Authorization": f"Bearer {token}", "Accept": "application/json"})
              log(f"mos_readiness_http={st}")
              log(f"MOS_AUTHENTICATED_LIVE={'PASS' if st == 200 else 'FAIL'}")
          else:
              st, _ = fetch(url)
              log(f"mos_readiness_unauth_http={st}")
              log("MOS_AUTHENTICATED_LIVE=FAIL")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estate-mos-live-auth
          path: /tmp/estate-mos-live-auth.txt
          if-no-files-found: ignore
          retention-days: 3
