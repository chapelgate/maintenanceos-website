name: Reader challenge retry validation

on:
  push:
    branches:
      - fix/reader-challenge-single-retry-20261001

permissions:
  contents: write

concurrency:
  group: reader-challenge-retry-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild function bundle
        run: |
          npm exec --yes --package=esbuild@0.25.10 --             esbuild packages/onboarding-ingest/packages/website/scan/index.ts             --bundle --platform=node --target=node24 --format=cjs             --outfile=packages/onboarding-ingest/packages/website/scan/bundle.cjs
          node -e "const m=require('./packages/onboarding-ingest/packages/website/scan/bundle.cjs'); if(typeof m.main!=='function') process.exit(1)"
      - name: Targeted scanner tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/fetch-safe.test.ts             packages/onboarding-ingest/src/extract.test.ts             packages/onboarding-ingest/src/scan.test.ts             packages/onboarding-ingest/src/function-wrapper.test.ts
      - name: Full regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx eslint packages/onboarding-ingest/src/scan.ts packages/onboarding-ingest/src/scan.test.ts
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: |
          npm run build
          test "$(find out -name index.html -type f | wc -l)" -ge 28
      - name: Commit bundle after green gate
        shell: bash
        run: |
          set -euo pipefail
          bundle='packages/onboarding-ingest/packages/website/scan/bundle.cjs'
          if git diff --quiet -- "$bundle"; then exit 0; fi
          git config user.name 'chapelgate-ci'
          git config user.email 'ci@chapelgate.invalid'
          git add "$bundle"
          git commit -m 'build: regenerate website scan function bundle'
          git push origin HEAD:fix/reader-challenge-single-retry-20261001
