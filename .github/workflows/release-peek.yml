name: Reader anti-bot browser-engine probe

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare Reader auto and browser engines
        shell: bash
        run: |
          set -euo pipefail
          url='https://r.jina.ai/https://alleygates.co.uk/'

          probe() {
            label="$1"; shift
            echo "=== $label ==="
            code="$(curl --max-time 45 -sS -o /tmp/body -D /tmp/head -w '%{http_code}' "$@" "$url" || true)"
            echo "HTTP_STATUS=$code BYTES=$(wc -c </tmp/body)"
            sed -n '1,25p' /tmp/head
            for needle in 'Security Verification' 'ALLEY GATE KEYS' 'Alley Gate Installation' 'CCTV' 'Security Fencing'; do
              printf '%s=' "$needle"
              grep -F -i -q "$needle" /tmp/body && echo YES || echo NO
            done
            echo "--- FIRST 500 ---"
            head -c 500 /tmp/body
            echo
          }

          probe AUTO_HTML             -H 'X-Respond-With: html'             -H 'Accept: text/html'

          probe BROWSER_HTML             -H 'X-Respond-With: html'             -H 'X-Engine: browser'             -H 'X-No-Cache: true'             -H 'Accept: text/html'
