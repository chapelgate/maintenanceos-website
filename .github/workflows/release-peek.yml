name: Reader auto no-cache reliability probe

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Compare cached and no-cache Reader auto mode
        shell: bash
        run: |
          set -euo pipefail
          url='https://r.jina.ai/https://alleygates.co.uk/'

          probe() {
            label="$1"; shift
            echo "=== $label ==="
            code="$(curl --max-time 35 -sS -o /tmp/body -D /tmp/head -w '%{http_code}' "$@" "$url" || true)"
            echo "HTTP_STATUS=$code BYTES=$(wc -c </tmp/body)"
            for needle in 'Security Verification' 'ALLEY GATE KEYS' 'Alley Gate Installation' 'CCTV' 'Security Fencing'; do
              printf '%s=' "$needle"
              grep -F -i -q "$needle" /tmp/body && echo YES || echo NO
            done
            echo "TITLE=$(grep -oi -m1 '<title>[^<]*</title>' /tmp/body || true)"
          }

          for i in 1 2 3; do
            probe "AUTO_CACHED_$i"               -H 'X-Respond-With: html'               -H 'Accept: text/html'
            probe "AUTO_NOCACHE_$i"               -H 'X-Respond-With: html'               -H 'X-No-Cache: true'               -H 'Accept: text/html'
          done
