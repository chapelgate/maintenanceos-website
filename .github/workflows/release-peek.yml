name: Alley Gates live path probe

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Alley Gates paths through deployed scanner
        shell: bash
        run: |
          set -euo pipefail
          origin='https://seahorse-app-4oasq.ondigitalocean.app'
          curl -fsS "$origin/release.json"
          echo
          for url in             'https://alleygates.co.uk/'             'https://www.alleygates.co.uk/'             'https://alleygates.co.uk/home/'             'https://alleygates.co.uk/contact/'             'https://alleygates.co.uk/wp-json/'             'https://alleygates.co.uk/wp-json/wp/v2/pages?per_page=1'; do
            echo "=== $url ==="
            code="$(curl --max-time 25 -sS -o /tmp/body -w '%{http_code}'               -X POST "$origin/api/website/scan"               -H 'Content-Type: application/json'               -H 'Accept: application/json'               --data-binary "{\"url\":\"$url\"}" || true)"
            echo "HTTP_STATUS=$code"
            cat /tmp/body
            echo
          done
