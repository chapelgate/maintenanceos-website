name: Alley Gates reader fallback probe

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public reader fallback only
        shell: bash
        run: |
          set -euo pipefail
          for target in             'https://alleygates.co.uk/'             'https://expressgasdelivery.com/'
          do
            echo "=== $target ==="
            encoded="https://r.jina.ai/$target"
            code="$(curl --max-time 30 -sS -o /tmp/body -D /tmp/head -w '%{http_code}'               -H 'Accept: text/plain' "$encoded" || true)"
            echo "HTTP_STATUS=$code"
            sed -n '1,25p' /tmp/head
            echo "--- BODY FIRST 4000 ---"
            head -c 4000 /tmp/body || true
            echo
          done
