name: PR152 live scanner verification

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact release and real site knowledge
        shell: bash
        run: |
          set -euo pipefail
          origin='https://seahorse-app-4oasq.ondigitalocean.app'
          expected='fdd526696294e28faf9b57603a1811c816893cde'

          curl -fsS "$origin/release.json" -o /tmp/release.json
          cat /tmp/release.json
          python3 -c "import json; r=json.load(open('/tmp/release.json')); assert r.get('commit') == '$expected', r"

          probe() {
            name="$1"
            url="$2"
            out="$3"
            for n in 1 2 3; do
              code="$(curl --max-time 30 -sS -o "$out" -w '%{http_code}' -X POST "$origin/api/website/scan" -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary "{\"url\":\"$url\"}" || true)"
              echo "$name attempt=$n HTTP_STATUS=$code"
              cat "$out"
              echo
              test "$code" = '200'
            done
          }

          probe ALLEY 'https://alleygates.co.uk/' /tmp/alley.json
          probe GAS 'https://expressgasdelivery.com/' /tmp/gas.json

          python3 -c "import json; a=json.load(open('/tmp/alley.json')); b=json.dumps(a).lower(); assert a.get('ok') is True; assert all(x in b for x in ['alley gate installation','cctv','security fencing','alley gate keys']); assert 'reader_fallback_used' in (a.get('warnings') or []); assert 'security verification' not in b"
          python3 -c "import json; g=json.load(open('/tmp/gas.json')); d=g.get('draft') or {}; b=json.dumps(g).lower(); assert g.get('ok') is True; assert (d.get('hours') or '').strip(); assert (d.get('services') or '').strip(); assert 'propane' in b and 'patio gas' in b"

          echo 'EXACT_RELEASE=PASS'
          echo 'ALLEY_GATES_3X=PASS'
          echo 'EXPRESS_GAS_3X=PASS'
          echo 'LIVE_SCANNER=PASS'
