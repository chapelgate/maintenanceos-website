name: Final website knowledge freeze verification

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for final docs-only release and smoke real sites
        shell: bash
        run: |
          set -euo pipefail
          origin='https://seahorse-app-4oasq.ondigitalocean.app'
          expected='64c3af10ddfe539c925da0a4823ae84be1ceb9ae'

          deployed=''
          for i in $(seq 1 50); do
            curl -fsS "$origin/release.json" -o /tmp/release.json || true
            deployed="$(python3 -c "import json; print(json.load(open('/tmp/release.json')).get('commit',''))" 2>/dev/null || true)"
            echo "attempt=$i deployed=$deployed"
            [ "$deployed" = "$expected" ] && break
            sleep 8
          done
          test "$deployed" = "$expected"
          cat /tmp/release.json

          for spec in 'alley|https://alleygates.co.uk/' 'gas|https://expressgasdelivery.com/'; do
            name="${spec%%|*}"
            url="${spec#*|}"
            code="$(curl --max-time 30 -sS -o "/tmp/$name.json" -w '%{http_code}' -X POST "$origin/api/website/scan" -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary "{\"url\":\"$url\"}" || true)"
            echo "$name HTTP_STATUS=$code"
            cat "/tmp/$name.json"
            echo
            test "$code" = '200'
          done

          python3 -c "import json; a=json.load(open('/tmp/alley.json')); b=json.dumps(a).lower(); assert a.get('ok') is True; assert all(x in b for x in ['alley gate installation','cctv','security fencing','alley gate keys']); assert 'reader_fallback_used' in (a.get('warnings') or [])"
          python3 -c "import json; g=json.load(open('/tmp/gas.json')); d=g.get('draft') or {}; assert g.get('ok') is True and (d.get('hours') or '').strip() and (d.get('services') or '').strip()"

          echo 'FINAL_RELEASE=PASS'
          echo 'FINAL_LIVE_SMOKE=PASS'
