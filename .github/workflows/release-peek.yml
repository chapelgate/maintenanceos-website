name: Reader HTML fallback probe

on:
  push:
    branches:
      - diag/post-pr150-live-20261001

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Reader rendered HTML mode
        shell: bash
        run: |
          set -euo pipefail
          url='https://r.jina.ai/https://alleygates.co.uk/'
          code="$(curl --max-time 35 -sS -o /tmp/body -D /tmp/head -w '%{http_code}'             -H 'X-Respond-With: html'             -H 'Accept: text/html'             "$url" || true)"
          echo "HTTP_STATUS=$code"
          sed -n '1,30p' /tmp/head
          echo "BYTES=$(wc -c </tmp/body)"
          for needle in 'ALLEY GATE KEYS' 'Wirral Alley Gate Key' 'CCTV' 'Security Fencing' 'Alley Gate Installation'; do
            echo "--- $needle ---"
            grep -F -i -m 3 -C 1 "$needle" /tmp/body || true
          done
          echo "--- FIRST 1200 ---"
          head -c 1200 /tmp/body
          echo
          test "$code" = '200'
