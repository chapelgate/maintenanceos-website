name: Website Create repair validation

on:
  push:
    branches:
      - website/mobile-submit-email-20260928

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, chapelgate, estate-trusted]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node, build and Chromium validation in isolated container
        run: |
          docker run --rm --shm-size=1g -v "$PWD:/work" -w /work node:24-bookworm bash -lc '
            set -euo pipefail;
            apt-get update -qq;
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium >/dev/null;
            node --version;
            npm --version;
            npm ci;
            node scripts/create-mobile-submit.test.mjs;
            node --experimental-strip-types --test src/lib/lead-adapter.test.ts;
            node --test scripts/form-stub-server.test.mjs scripts/create-a11y.test.mjs scripts/customer-agent-configuration.test.mjs;
            npm test;
            npx eslint src/components/CreateReceptionistForm.tsx src/components/CreateReceptionistLaterSteps.tsx src/lib/lead-adapter.ts src/lib/lead-adapter.test.ts;
            npm run accessibility:check;
            npx tsc --noEmit;
            npm run build;
            BROWSER_PATH=/usr/bin/chromium npm run browser:smoke
          '
      - name: Patch integrity
        run: git diff --check e976d086652ce5b4e8ce51cf32e535d2e450db92..HEAD
