name: Website integration repair validation

on:
  push:
    branches:
      - ci/website-integration-recovery-20260928
  pull_request:
    paths:
      - ".github/workflows/website-integration-repair-validation.yml"
      - "src/components/CreateReceptionistForm.tsx"
      - "src/components/CreateReceptionistLaterSteps.tsx"
      - "src/lib/lead-adapter.ts"
      - "packages/onboarding-ingest/**"
      - "scripts/create-*.mjs"
      - "scripts/*lead*.mjs"
      - "docs/FORM_ENDPOINT_CONTRACT.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Scanner V2 companion image when onboarding-ingest changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^packages/onboarding-ingest/'; then
            echo "Scanner companion unchanged; skipping image smoke."
            exit 0
          fi
          image="mos-scanner-v2-candidate:${HEAD_SHA}"
          docker build -f packages/onboarding-ingest/Dockerfile -t "$image" .
          docker run --rm --workdir /app/packages/onboarding-ingest "$image" \
            node -e '(async()=>{const {chromium}=await import("playwright");const browser=await chromium.launch({headless:true});await browser.close();await import("pdfjs-dist/legacy/build/pdf.mjs");console.log("scanner-v2-runtime-deps=ok")})().catch((error)=>{console.error(error);process.exit(1)})'
          cid="$(docker run -d --rm -p 127.0.0.1:18788:8788 \
            -e PORT=8788 \
            -e ONBOARDING_WEB_INGEST=true \
            -e ONBOARDING_SCANNER_V2=true \
            "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if health="$(curl --fail --silent --show-error http://127.0.0.1:18788/health 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$health"
          node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true||h.ingestEnabled!==true||h.scannerV2Enabled!==true) process.exit(1)' "$health"
          docker rm -f "$cid" >/dev/null
          trap - EXIT

      - name: Validate frozen website repair in isolated container
        env:
          SOURCE_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm --shm-size=1g -e SOURCE_COMMIT_HASH -v "$PWD:/src:ro" node:24-bookworm bash -lc '
            set -euo pipefail
            cp -a /src /work
            cd /work
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium >/dev/null
            npm ci
            npm test
            npm run accessibility:check
            npx eslint src/components/CreateReceptionistForm.tsx src/components/CreateReceptionistLaterSteps.tsx src/lib/lead-adapter.ts
            npx tsc --noEmit
            NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan npm run build
            test "$(find out -name index.html -type f | wc -l)" -eq 28
            test -f out/robots.txt
            test -f out/sitemap.xml
            BROWSER_PATH=/usr/bin/chromium npm run browser:smoke
            BROWSER_PATH=/usr/bin/chromium NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan node scripts/create-mobile-stability-browser.mjs
          '
      - name: Patch integrity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi
