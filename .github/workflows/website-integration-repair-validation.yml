name: Website integration repair validation

on:
  push:
    branches:
      - ci/website-integration-recovery-20260928
  pull_request:
    paths:
      - "src/components/CreateReceptionistForm.tsx"
      - "src/components/CreateReceptionistLaterSteps.tsx"
      - "src/lib/lead-adapter.ts"
      - "packages/onboarding-ingest/**"
      - "scripts/create-*.mjs"
      - "scripts/*lead*.mjs"
      - "docs/FORM_ENDPOINT_CONTRACT.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, chapelgate, estate-trusted]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen website repair in isolated container
        run: |
          docker run --rm --shm-size=1g -v "$PWD:/src:ro" node:24-bookworm bash -lc '
            set -euo pipefail
            cp -a /src /work
            cd /work
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium >/dev/null
            npm ci
            npm test
            npm run accessibility:check
            npx eslint src/components/CreateReceptionistForm.tsx src/components/CreateReceptionistLaterSteps.tsx src/lib/lead-adapter.ts
            npx tsc --noEmit
            NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan npm run build
            test "$(find out -name index.html -type f | wc -l)" -eq 28
            test -f out/robots.txt
            test -f out/sitemap.xml
            BROWSER_PATH=/usr/bin/chromium npm run browser:smoke
            BROWSER_PATH=/usr/bin/chromium NEXT_PUBLIC_FORM_ENDPOINT=http://127.0.0.1:8787/leads NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT=http://127.0.0.1:8788/scan node scripts/create-mobile-stability-browser.mjs
          '
      - name: Patch integrity
        run: git diff --check 7d519ca8bea09fc87b9d41be7ebf95f7baa6def0^..HEAD
