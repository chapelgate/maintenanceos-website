name: Website integration repair validation

on:
  push:
    branches:
      - website/mobile-create-stability-20260928
  pull_request:
    paths:
      - "src/components/CreateReceptionistForm.tsx"
      - "src/components/CreateReceptionistLaterSteps.tsx"
      - "src/lib/lead-adapter.ts"
      - "packages/onboarding-ingest/**"
      - "scripts/create-*.mjs"
      - "scripts/*lead*.mjs"
      - "docs/FORM_ENDPOINT_CONTRACT.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
      NEXT_PUBLIC_ONBOARDING_SCAN_ENDPOINT: http://127.0.0.1:8788/scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run accessibility:check
      - run: npx eslint src/components/CreateReceptionistForm.tsx src/components/CreateReceptionistLaterSteps.tsx src/lib/lead-adapter.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify static export route count
        run: test "$(find out -name index.html | wc -l)" -eq 30
      - name: Existing real-browser viewport smoke
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: npm run browser:smoke
      - name: Mobile create hydration and submission acceptance
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: node scripts/create-mobile-stability-browser.mjs
      - run: git diff --check HEAD^ HEAD
