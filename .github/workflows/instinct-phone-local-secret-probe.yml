name: Instinct phone local-secret probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, hlo-commission-temp]
    timeout-minutes: 4
    steps:
      - name: Probe existing local Twilio source
        shell: powershell
        run: |
          $p='C:\Users\Andy\.chapelgate-cloud\twilio-transfer.env'
          Write-Output ("HOST="+$env:COMPUTERNAME)
          Write-Output ("USER="+[System.Security.Principal.WindowsIdentity]::GetCurrent().Name)
          if(Test-Path $p){Write-Output 'TWILIO_LOCAL_SOURCE=PRESENT'}else{Write-Output 'TWILIO_LOCAL_SOURCE=ABSENT'; exit 2}
