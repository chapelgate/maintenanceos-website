name: Scanner V2 Stage 3 validation

on:
  push:
    branches:
      - feat/scanner-v2-stage3-url-policy-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage3-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scanner V2 Stage 2-3 targeted tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/scanner-v2-foundation.test.ts             packages/onboarding-ingest/src/scanner-v2-discovery.test.ts             packages/onboarding-ingest/src/scanner-v2-url-policy.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Enforce surgical change boundary
        shell: bash
        run: |
          set -euo pipefail
          base="b6f15114dd57f121d6bb9124d26c7c8f5a9d43e5"
          git diff --name-only "$base"...HEAD | tee /tmp/changed.txt
          unexpected="$(grep -Ev '^packages/onboarding-ingest/src/(scanner-v2-discovery\.ts|scanner-v2-discovery\.test\.ts|scanner-v2-url-policy\.ts|scanner-v2-url-policy\.test\.ts|index\.ts)$|^\.github/workflows/scanner-v2-stage3-validation\.yml$' /tmp/changed.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "UNEXPECTED_CHANGE_SURFACE"
            printf '%s\n' "$unexpected"
            exit 3
          fi
          echo "STAGE3_SURGICAL_CHANGESET=PASS"
          echo "GOLDEN_PHONE_LINE_CHANGE_SURFACE=0"
