name: Scanner IP-family guard validation

on:
  push:
    branches:
      - fix/scanner-ipv4-family-guard-20261001

permissions:
  contents: read

concurrency:
  group: scanner-ipv4-family-guard-20261001
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Targeted scanner and deployed-function tests
        run: |
          node --experimental-strip-types --test             packages/onboarding-ingest/src/fetch-safe.test.ts             packages/onboarding-ingest/src/scan.test.ts             packages/onboarding-ingest/src/extract.test.ts             packages/onboarding-ingest/src/function-wrapper.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx eslint packages/onboarding-ingest/src/fetch-safe.ts packages/onboarding-ingest/src/fetch-safe.test.ts
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: |
          npm run build
          test "$(find out -name index.html -type f | wc -l)" -ge 28
          test -f out/robots.txt
          test -f out/sitemap.xml
