name: MaintenanceOS Provider Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_live_call_evidence.py'
      - '.github/workflows/provider-evidence.yml'
permissions:
  contents: read

concurrency:
  group: maintenanceos-provider-evidence
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, chapelgate, estate-trusted]
    timeout-minutes: 10
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reconcile redacted Twilio call metadata
        run: python scripts/reconcile_live_call_evidence.py > provider-evidence.json
      - name: Assert artifact contains no obvious phone-number or SID plaintext
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '\+[0-9]{7,}|AC[a-fA-F0-9]{32}|CA[a-fA-F0-9]{32}' provider-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenanceos-provider-evidence-${{ github.sha }}
          path: provider-evidence.json
          retention-days: 7
