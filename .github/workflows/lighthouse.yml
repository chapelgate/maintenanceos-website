name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Start local server
        run: npx serve out -l 3000 &
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
      - name: Install Lighthouse
        run: npm install -g lighthouse@latest
      - name: Run Lighthouse on key pages (mobile)
        run: |
          set -euo pipefail
          PAGES=("/" "/pricing/" "/create/" "/contact/")
          FAILED=0
          for page in "${PAGES[@]}"; do
            echo "=== Testing $page ==="
            lighthouse "http://localhost:3000$page" \
              --form-factor=mobile \
              --output=json \
              --output-path=/tmp/lighthouse-${page//\//-}.json \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

            # Extract scores
            PERF=$(cat /tmp/lighthouse-${page//\//-}.json | jq '.categories.performance.score * 100')
            A11Y=$(cat /tmp/lighthouse-${page//\//-}.json | jq '.categories.accessibility.score * 100')
            BEST=$(cat /tmp/lighthouse-${page//\//-}.json | jq '.categories["best-practices"].score * 100')
            SEO=$(cat /tmp/lighthouse-${page//\//-}.json | jq '.categories.seo.score * 100')

            echo "Performance: $PERF"
            echo "Accessibility: $A11Y"
            echo "Best Practices: $BEST"
            echo "SEO: $SEO"

            # Check if any category < 90
            for score in $PERF $A11Y $BEST $SEO; do
              if (( $(echo "$score < 90" | bc -l) )); then
                echo "FAIL: $page has category score $score < 90"
                FAILED=1
              fi
            done
          done

          if [ $FAILED -eq 1 ]; then
            echo "Lighthouse CI FAILED: One or more pages have category scores below 90"
            exit 1
          else
            echo "All pages passed Lighthouse CI (all categories >= 90)"
          fi