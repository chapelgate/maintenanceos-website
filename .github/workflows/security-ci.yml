name: MaintenanceOS Security CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  group: maintenanceos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit cyclonedx-bom
      - name: Dependency consistency
        run: pip check
      - name: Vulnerability audit
        id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output pip-audit.json
      - name: Generate Python SBOM
        if: always()
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenanceos-security-evidence-${{ github.sha }}
          path: |
            pip-audit.json
            sbom-python.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce vulnerability gate
        if: steps.audit.outcome == 'failure'
        run: |
          echo 'pip-audit reported one or more vulnerable dependencies.' >&2
          exit 1

  secret-pattern-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject obvious committed private keys and provider secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- ':!*.example' ':!*.md' '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|AC[a-fA-F0-9]{32}|SK[a-fA-F0-9]{32})'; then
            echo 'Potential secret material found in tracked source.' >&2
            exit 1
          fi
          echo 'No obvious provider/private-key secret patterns found.'
