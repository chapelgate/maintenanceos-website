name: Scanner V2 Stage 0-1 validation

on:
  push:
    branches:
      - feat/scanner-v2-stage01-foundation-20261002

permissions:
  contents: read

concurrency:
  group: scanner-v2-stage01-foundation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scanner V1 + V2 foundation tests
        run: |
          node --experimental-strip-types --test packages/onboarding-ingest/src/*.test.ts
      - name: Full repository regression
        run: npm test
      - name: Accessibility
        run: npm run accessibility:check
      - name: Static analysis
        run: |
          npx eslint packages/onboarding-ingest/src/scanner-v2-foundation.ts packages/onboarding-ingest/src/scanner-v2-foundation.test.ts packages/onboarding-ingest/src/types.ts packages/onboarding-ingest/src/index.ts
          npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: http://127.0.0.1:8787/leads
        run: npm run build
      - name: Prove Scanner V2 remains default-off and V1 source untouched
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { isScannerV2Enabled } from './packages/onboarding-ingest/src/scanner-v2-foundation.ts';
          assert.equal(isScannerV2Enabled({}), false);
          assert.equal(isScannerV2Enabled({ONBOARDING_SCANNER_V2:'false'}), false);
          console.log('SCANNER_V2_DEFAULT_OFF=PASS');
          NODE
          base="a71507d2f02f7219ffa685bb3acbb6722a8a84ff"
          git diff --exit-code "$base"...HEAD --             packages/onboarding-ingest/src/scan.ts             packages/onboarding-ingest/src/fetch-safe.ts             packages/onboarding-ingest/src/extract.ts             packages/onboarding-ingest/packages/website/scan/bundle.cjs
          echo "SCANNER_V1_RUNTIME_SOURCE_UNCHANGED=PASS"
          echo "GOLDEN_PHONE_LINE_CHANGE_SURFACE=0"
