name: Security Live Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_SITE_URL: https://worksmartos.co.uk
      REQUIRE_SECURITY_HEADERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run live security audit
        run: npm run security:live