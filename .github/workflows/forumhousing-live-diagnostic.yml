name: Forum Housing contact reader diagnostic

on:
  push:
    branches:
      - diag/forumhousing-live-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Forum contact page reader stability
        shell: bash
        run: |
          set -euo pipefail
          target='https://forumhousing.co.uk/contact-us/'
          reader="https://r.jina.ai/$target"

          for i in 1 2 3 4 5; do
            echo "=== ATTEMPT $i ==="
            code="$(curl --max-time 30 -sS -o "/tmp/body$i" -D "/tmp/head$i" -w '%{http_code}'               -H 'Accept: text/html'               -H 'X-Respond-With: html'               -H 'X-No-Cache: true' "$reader" || true)"
            echo "HTTP_STATUS=$code"
            sed -n '1,25p' "/tmp/head$i" || true
            echo "TITLE:"
            grep -Eio -m 1 '<title[^>]*>[^<]+' "/tmp/body$i" || true
            echo "HOURS:"
            grep -Ei -m 8 -C 2 'Monday|Friday|9am|9:00|opening|Head Office' "/tmp/body$i" || true
            echo "CHALLENGE MARKERS:"
            grep -Ei -m 8 -C 1 'verify you are human|checking your browser|security verification|captcha' "/tmp/body$i" || true
            echo "BYTES=$(wc -c < "/tmp/body$i" 2>/dev/null || echo 0)"
          done
