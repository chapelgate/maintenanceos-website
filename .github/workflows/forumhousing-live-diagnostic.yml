name: Forum Housing live scanner diagnostic

on:
  push:
    branches:
      - diag/forumhousing-live-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prove TLS failure and bounded reader recovery
        shell: bash
        run: |
          set -euo pipefail
          target='https://forumhousing.co.uk/'
          ua='MaintenanceOS-OnboardingScan/0.1 (+https://github.com/chapelgate/maintenanceos-website; untrusted-data)'

          echo '=== DIRECT VERIFIED HTTPS ==='
          code="$(curl -L --max-redirs 4 --connect-timeout 8 --max-time 20 -sS             -A "$ua" -o /tmp/direct -D /tmp/direct.h -w '%{http_code}' "$target" || true)"
          echo "DIRECT_STATUS=$code"
          cat /tmp/direct.h || true
          echo

          echo '=== CERTIFICATE CHAIN DIAGNOSTIC ==='
          timeout 15 openssl s_client -connect forumhousing.co.uk:443 -servername forumhousing.co.uk -showcerts </dev/null 2>&1 |             sed -n '1,140p' || true

          echo '=== EXISTING PUBLIC READER FALLBACK ==='
          reader="https://r.jina.ai/$target"
          rcode="$(curl --max-time 30 -sS -o /tmp/reader -D /tmp/reader.h -w '%{http_code}'             -H 'Accept: text/html'             -H 'X-Respond-With: html'             -H 'X-No-Cache: true' "$reader" || true)"
          echo "READER_STATUS=$rcode"
          sed -n '1,30p' /tmp/reader.h || true
          wc -c /tmp/reader || true
          echo '--- READER FACTS ---'
          for needle in             'Forum Housing Association'             'supported housing'             'support services'             'Wirral'             'Cheshire'             'Warrington'             '0151 649 9718'
          do
            echo "--- $needle ---"
            grep -F -i -m 3 -C 2 "$needle" /tmp/reader || true
          done
