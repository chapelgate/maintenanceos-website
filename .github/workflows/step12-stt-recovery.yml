name: Step 12 STT recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step12-stt-recovery.yml"

permissions:
  contents: read
  issues: write

jobs:
  repair-stt:
    runs-on: [self-hosted, linux, x64, chapelgate, estate-trusted]
    timeout-minutes: 15
    env:
      TARGET_HOST: 134.209.189.117
      ISSUE_NUMBER: "88"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repair and physically verify Step 12.3
        shell: bash
        run: |
          set -uo pipefail
          OUT=/tmp/step12-stt-recovery.txt
          : > "$OUT"
          exec > >(tee -a "$OUT") 2>&1
          echo "STEP12_3_AUTORECOVERY=start"
          SSH_COMMON=(-o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new)
          KEY=""
          RC=0
          for k in "$HOME/.ssh/maintenanceos_recovery_20260920" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/id_rsa" "/root/.ssh/maintenanceos_recovery_20260920" "/root/.ssh/id_ed25519" "/root/.ssh/id_rsa"; do
            if [ -f "$k" ] && ssh "${SSH_COMMON[@]}" -o IdentitiesOnly=yes -i "$k" root@"$TARGET_HOST" 'echo ssh_ok' >/dev/null 2>&1; then
              KEY="$k"
              break
            fi
          done
          if [ -n "$KEY" ]; then
            SSH=(ssh "${SSH_COMMON[@]}" -o IdentitiesOnly=yes -i "$KEY")
            echo "ssh_access=key"
          elif ssh "${SSH_COMMON[@]}" root@"$TARGET_HOST" 'echo ssh_ok' >/dev/null 2>&1; then
            SSH=(ssh "${SSH_COMMON[@]}")
            echo "ssh_access=default"
          else
            echo "ssh_access=FAIL"
            STATUS=BLOCKED
            RC=90
          fi
          if [ "$RC" -eq 0 ]; then
            echo '' | base64 -d | "${SSH[@]}" root@"$TARGET_HOST" 'python3 -'
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "${SSH[@]}" root@"$TARGET_HOST" 'set -e
              cd /opt/maintenanceos/local-voice-canary
              python3 -m py_compile local_voice.py
              docker compose -f docker-compose.local-voice.yml up -d --force-recreate voice-stt
              for i in $(seq 1 45); do
                if curl -fsS http://127.0.0.1:8091/health >/dev/null; then break; fi
                sleep 2
              done
              curl -fsS http://127.0.0.1:8091/health >/dev/null
              curl -fsS -X POST http://127.0.0.1:8091/v1/models/Systran%2Ffaster-whisper-tiny.en >/tmp/step12-model-load.txt
              docker build -q -t mos-local-candidate:step12-pocket .
              python3 launch_canary.py
              sleep 8
              test "$(docker inspect mos-local-candidate --format "{{.State.Status}}")" = running
              test "$(docker inspect mos-local-candidate --format "{{.State.Health.Status}}")" = healthy
              docker inspect mos-local-voice-voice-stt-1 --format "{{range .Config.Env}}{{println .}}{{end}}" | grep -E "WHISPER__TTL=-1|WHISPER__CPU_THREADS=4|WHISPER__COMPUTE_TYPE=int8"
              docker logs --tail 80 mos-local-voice-voice-stt-1 2>&1 | grep -m1 "WhisperConfig" || true'
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo '' | base64 -d | "${SSH[@]}" root@"$TARGET_HOST" 'cat > /tmp/step12_3_final_bench.py'
            "${SSH[@]}" root@"$TARGET_HOST" 'docker exec -i mos-local-candidate python - < /tmp/step12_3_final_bench.py'
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo '' | base64 -d | "${SSH[@]}" root@"$TARGET_HOST" 'cat > /tmp/step12_3_public_verify.py'
            "${SSH[@]}" root@"$TARGET_HOST" 'docker exec -i mos-local-candidate python - < /tmp/step12_3_public_verify.py'
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "${SSH[@]}" root@"$TARGET_HOST" 'cd /opt/maintenanceos/local-voice-canary && python3 scripts/verify_voice_candidate_integrity.py --evidence-dir docs/sovereign-voice --silero .sovereign-cache/silero/silero_vad.onnx --smart-turn .sovereign-cache/smart-turn/smart-turn-v3.2-cpu.onnx'
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then STATUS=PASS; else STATUS=${STATUS:-FAIL}; fi
          echo "STEP12_3_STATUS=$STATUS"
          echo "exit_code=$RC"
          python3 - <<'PY'
          import json, os, urllib.request
          body=open("/tmp/step12-stt-recovery.txt",encoding="utf-8",errors="replace").read()[-50000:]
          status="UNKNOWN"
          for line in body.splitlines():
              if line.startswith("STEP12_3_STATUS="):
                  status=line.split("=",1)[1]
          text="STEP 12.3 automated estate recovery - "+status+"\n\n```text\n"+body+"\n```"
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=json.dumps({"body":text}).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:
              print("issue_comment_http="+str(r.status))
          PY
          exit "$RC"
