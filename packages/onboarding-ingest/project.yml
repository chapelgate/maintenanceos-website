packages:
  - name: website
    # DigitalOcean Functions only pass variables this file declares.
    # Values are substituted at build time from the component env, so the
    # values must be RUN_AND_BUILD_TIME. Quotes are required.
    # Droplet-only vars (ONBOARDING_WEB_INGEST, PORT, SCANNER_V2_STATE_ROOT)
    # stay on the droplet process and are not declared here.
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_TTS_MODEL: "${GEMINI_TTS_MODEL}"
      GEMINI_TTS_VOICE: "${GEMINI_TTS_VOICE}"
      PIPER_TTS_URL: "${PIPER_TTS_URL}"
      PIPER_TTS_SECRET: "${PIPER_TTS_SECRET}"
      SCANNER_V2_RUNTIME_URL: "${SCANNER_V2_RUNTIME_URL}"
    functions:
      - name: scan
        runtime: nodejs:22
        main: main
        web: true
        limits:
          timeout: 120000
          memory: 256
          logs: 64
      - name: voice
        runtime: nodejs:22
        main: main
        web: true
        limits:
          timeout: 30000
          memory: 128
          logs: 16
