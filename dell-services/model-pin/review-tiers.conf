# review-tiers.conf — tiered review by risk (mac-council-lane scope F, 24 Nov 13:15 GMT)
# Format: one rule per line, key=value.
# Tier S (small): docs, config, tests, or diff < ~200 changed lines touching no release path.
#   Needs ONE reviewer from a different model family than the author; reviewer GO at exact head SHA + green checks merges.
# Tier F (structural-fast): small non-release structural fixes to the council system itself
#   (council rules, logging, routing, hardware or lane allocation). EXACTLY ONE reviewer,
#   from a different model family than the last reviewer on that change or area (lookup
#   COUNCIL-OUTCOMES.tsv / OUTCOME.json once outcomes-loop-councils-20261124 ships them;
#   until then use the last out/council* file for that area). The 30-min cap applies
#   (TIMEOUT -> HOLD-RETRY, never GO), and OUTCOME.json is required.
#   Exclusions, which always go to tier R full panel: anything that changes what councils
#   may decide, spend, legal/signing, merge powers or release gates. Spend and hardware
#   purchases still go to readiness/PARKED.md. If in doubt, it is NOT tier F.
# Tier R (release): release candidates, gate PRs, release merges to main → full two-family council.
#   Councils decide every merge; nothing merges without a GO.
# If in doubt → tier R.
# Data file read by actions.py and check.py via classifier() (see tier rule below).
#
release_path_globs=release/*,main/*,deploy/*,auth/*,security/*,migrations/*,gate-*,spend/*,authority/*,merge-power/*,legal/*,signing/*
release_path_docs=docs/*,config/*,tests/*
tier_s_max_lines=200
tier_s_globs=docs/**,config/**,tests/**,**/*.md,**/*.cfg,**/*.ini,**/*.json,**/*.toml,**/*.yaml,**/*.yml
tier_f_globs=council-*,priority-lanes.conf,mac-review.sh,job-run-v6.sh,review-tiers.conf,check.py,actions.py
tier_f_max_lines=50
tier_f_exclusions=release/*,main/*,deploy/*,auth/*,security/*,migrations/*,gate-*,spend/*,authority/*,merge-power/*,legal/*,signing/*,release-*,main-*,deploy-*,gate-*
tier_r_globs=release/**,gate-*,deploy/**,auth/**,security/**,migrations/**,main/**
default_tier=R
