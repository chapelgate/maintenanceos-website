<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>MaintenanceOS conversion probe</title>
</head>
<body>
  <pre id="status">starting</pre>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const target = params.get("target") || "";
      if (!/^[^\s/@]+@[^\s/@]+\.[^\s/@]+$/.test(target)) {
        status.textContent = "invalid-target";
        return;
      }
      const body = new URLSearchParams({
        name: "MaintenanceOS Step 6 probe",
        email: target,
        message: "MaintenanceOS Step 6 conversion activation probe",
        _subject: "MaintenanceOS Step 6 form activation",
        _captcha: "false"
      });
      try {
        const response = await fetch(
          "https://formsubmit.co/ajax/" + encodeURIComponent(target),
          {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: body.toString()
          }
        );
        const text = await response.text();
        status.textContent = "http=" + response.status + " body=" + text.slice(0, 500);
      } catch (error) {
        status.textContent = "error=" + String(error && error.name || "unknown");
      }
    })();
  </script>
</body>
</html>
