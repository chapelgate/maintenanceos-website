services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenanceos
      POSTGRES_USER: maintenanceos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenanceos -d maintenanceos"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
  api:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+psycopg://maintenanceos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}@db:5432/maintenanceos
      DATABASE_DEPLOYMENT_MODE: local_compose
      DATABASE_TLS_REQUIRED: "false"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress
  worker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python","worker.py"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://maintenanceos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}@db:5432/maintenanceos
      DATABASE_DEPLOYMENT_MODE: local_compose
      DATABASE_TLS_REQUIRED: "false"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress
volumes:
  pgdata:
networks:
  backend:
    internal: true
  egress:
