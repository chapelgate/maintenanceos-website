services:
  api:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set managed staging DATABASE_URL}
      APP_SECRET: ${APP_SECRET:?Set staging APP_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set staging INTERNAL_API_TOKEN}
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-1}
      DATABASE_DEPLOYMENT_MODE: managed_test
      DATABASE_TLS_REQUIRED: "true"
      ENABLE_PUBLIC_PROVIDER_INGRESS: "false"
      ENABLE_REALTIME_VOICE: "false"
      ENABLE_LIVE_EMAIL: "false"
      ENABLE_LIVE_MESSAGING: "false"
      ALLOW_REMOTE_AI_SIDE_EFFECT_ENABLE: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [backend, egress]

  worker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set managed staging DATABASE_URL}
      APP_SECRET: ${APP_SECRET:?Set staging APP_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set staging INTERNAL_API_TOKEN}
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-1}
      DATABASE_DEPLOYMENT_MODE: managed_test
      DATABASE_TLS_REQUIRED: "true"
      ENABLE_PUBLIC_PROVIDER_INGRESS: "false"
      ENABLE_REALTIME_VOICE: "false"
      ENABLE_LIVE_EMAIL: "false"
      ENABLE_LIVE_MESSAGING: "false"
      ALLOW_REMOTE_AI_SIDE_EFFECT_ENABLE: "false"
    command: ["python", "worker.py"]
    networks: [backend, egress]

networks:
  backend:
    internal: true
  egress:

